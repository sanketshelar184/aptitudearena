services:
  postgres:
    image: postgres:16-alpine
    container_name: aptitudearena-postgres
    environment:
      POSTGRES_DB: aptitude_arena
      POSTGRES_USER: aptitude
      POSTGRES_PASSWORD: aptitude
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptitude -d aptitude_arena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
